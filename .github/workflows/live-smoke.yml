name: live-smoke

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/run_live.py'
      - 'scripts/run_live_daemon.py'
      - 'scripts/report_shadow.py'
      - 'config/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.env.example'
      - 'LIVE_SMOKE_TRIGGER'
      - '.github/workflows/live-smoke.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/run_live.py'
      - 'scripts/run_live_daemon.py'
      - 'scripts/report_shadow.py'
      - 'config/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.env.example'
      - 'LIVE_SMOKE_TRIGGER'
      - '.github/workflows/live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Credential-gated shadow pipeline smoke
        env:
          ROMAN_FDR_ALPHA: '0.25'
        run: |
          rm -f data/roman_snapshots.sqlite data/roman_tracking.sqlite data/roman_shadow.sqlite
          roman-live --capital 10000 --interval 20 --queries-per-source 1 --limit 10 --health-port 8788 --max-hours 0.025
      - name: Diagnostic report and fail-closed assertions
        run: |
          python scripts/report_shadow.py --out outputs/live/smoke_report
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('outputs/live/smoke_report.json').read_text())
          if int(r.get('snapshot_rows', 0)) == 0:
              funnel = r.get('candidate_funnel', {})
              cap = r.get('capital', {})
              assert int(funnel.get('positions_opened', 0)) == 0
              assert int(funnel.get('raw_candidate_observations', 0)) == 0
              assert abs(float(cap.get('final_mark_pnl', 0.0))) < 1e-9
              assert abs(float(cap.get('final_executable_pnl', 0.0))) < 1e-9
          PY
          echo '--- DASHBOARD ---'
          cat outputs/live/dashboard.json
          echo '--- DIAGNOSTIC ---'
          cat outputs/live/smoke_report.md
      - uses: actions/upload-artifact@v4
        with:
          name: reselling-bot-live-smoke
          path: |
            outputs/live/dashboard.json
            outputs/live/smoke_report.json
            outputs/live/smoke_report.md
