name: live-smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-smoke.yml'
  pull_request:
    paths:
      - 'LIVE_SMOKE_TRIGGER'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Multi-cycle real-network shadow smoke
        env:
          ROMAN_FDR_ALPHA: '0.25'
        run: |
          rm -f data/roman_snapshots.sqlite data/roman_tracking.sqlite data/roman_shadow.sqlite
          python scripts/run_live_daemon.py --capital 10000 --interval 20 --queries-per-source 1 --limit 10 --health-port 8788 --max-hours 0.025
      - name: Diagnostic report
        run: |
          python scripts/report_shadow.py --out outputs/live/smoke_report
          echo '--- DASHBOARD ---'
          cat outputs/live/dashboard.json
          echo '--- DIAGNOSTIC ---'
          cat outputs/live/smoke_report.md
      - uses: actions/upload-artifact@v4
        with:
          name: reselling-bot-live-smoke
          path: |
            outputs/live/dashboard.json
            outputs/live/smoke_report.json
            outputs/live/smoke_report.md
