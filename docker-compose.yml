services:
  roman-live:
    build: .
    container_name: roman-live
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "scripts/run_live_daemon.py", "--capital", "10000", "--interval", "300", "--queries-per-source", "8", "--limit", "25", "--health-port", "8787"]
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5).read()"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 20s
