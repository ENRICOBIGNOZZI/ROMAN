services:
  reselling-bot:
    build: .
    container_name: reselling-bot
    restart: "no"
    env_file:
      - .env
    command: ["roman-live", "--capital", "10000", "--interval", "300", "--queries-per-source", "4", "--limit", "30", "--health-port", "8787", "--max-hours", "48"]
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5).read()"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 20s
